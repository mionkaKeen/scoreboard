<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scoreboard</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">

    <div class="nav-title">
        🏐 Live Scoreboard !!
    </div>

    <button class="logout-btn" onclick="logoutGuest()">
        Logout
    </button>

</nav>

    <div class="container">

        <h1>Current Match !!</h1>

        <div class="scoreboard">

            <div class="team-card">
                <h2>Team A</h2>
                <div id="scoreA" class="score">0</div>
            </div>

            <div class="team-card">
                <h2>Team B</h2>
                <div id="scoreB" class="score">0</div>
            </div>

        </div>

    </div>

   
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>

        

        async function loadScore() {

            const { data, error } = await sb
                .from("scores")
                .select("*")
                .eq("match_id", currentMatchId)
                .single();

            if (error) {
                console.error(error);
                return;
            }

            document.getElementById("scoreA").textContent =
                data.team_a_score || 0;

            document.getElementById("scoreB").textContent =
                data.team_b_score || 0;
        }

        loadScore();

        setInterval(loadScore, 3000);

    </script>
    
    


</body>
</html>
